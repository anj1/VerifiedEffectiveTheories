<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="900" viewBox="0 0 1600 900" role="img"
     aria-labelledby="title description">
  <title id="title">Local spins, nested crossings, amplified fluctuations</title>
  <desc id="description">A finite-volume two-scale Ising result. The Binder crossing bracket for sizes 8 and 12 lies inside that for sizes 4 and 6. At separately sampled near-crossing parameters, the lowest axial spin-mode structure factor grows with size for both pairs. The joint statistical coverage is at least 85 percent conditional on ideal independent equilibrium samples and an external concentration bound. No infinite-volume critical point, exponent, or visible-light opalescence is claimed.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081723"/>
      <stop offset="0.55" stop-color="#0B1C2B"/>
      <stop offset="1" stop-color="#14243A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70F2D2"/>
      <stop offset="1" stop-color="#35C8C7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD78D"/>
      <stop offset="1" stop-color="#F9A86D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173145" stop-opacity="0.91"/>
      <stop offset="1" stop-color="#102537" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#36CEC4" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#36CEC4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#D8F2F1" opacity="0.12"/>
    </pattern>
    <pattern id="bonds" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 0H44M0 0V44" fill="none" stroke="#6F97A3" stroke-width="1.4" opacity="0.57"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <g id="up">
      <circle r="12" fill="#58DDC9" stroke="#BBFFF1" stroke-width="1.6"/>
      <path d="M-4 0H4M0-4V4" stroke="#08313A" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="down">
      <circle r="12" fill="#F8BE7A" stroke="#FFE3B5" stroke-width="1.6"/>
      <path d="M-4 0H4" stroke="#4B2D28" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <style>
      .sans { font-family: Inter, 'Avenir Next', 'DejaVu Sans', sans-serif; }
      .serif { font-family: 'STIX Two Text', Georgia, 'DejaVu Serif', serif; }
      .muted { fill: #A9C4CA; }
      .bright { fill: #F2FAF9; }
      .tealText { fill: #69E8CF; }
      .amberText { fill: #FFCC88; }
      .smallCaps { font-size: 17px; font-weight: 750; letter-spacing: 2.4px; }
      .panelTitle { font-size: 20px; font-weight: 750; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <circle cx="1218" cy="291" r="415" fill="url(#halo)"/>
  <path d="M0 274H1600" stroke="#6F9BAB" stroke-width="1" opacity="0.26"/>

  <g class="sans">
    <rect x="78" y="49" width="403" height="39" rx="19.5" fill="#173D47" stroke="#5DDDC8" stroke-width="1.1"/>
    <circle cx="101" cy="68.5" r="5" fill="#63E5CD"/>
    <text x="118" y="75" class="tealText smallCaps" font-size="15">FINITE-VOLUME RESULT</text>
    <text x="78" y="164" class="bright" font-size="61" font-weight="760" letter-spacing="-2.4">Local spins, nested crossings,</text>
    <text x="78" y="231" fill="url(#teal)" font-size="61" font-weight="760" letter-spacing="-2.4">amplified fluctuations.</text>
    <text x="80" y="264" class="muted" font-size="19">Two independent size transformations in a periodic 3D zero-field Ising model</text>

    <g transform="translate(1368 79)">
      <circle r="63" fill="#1C4550" stroke="#69E8CF" stroke-width="1.6"/>
      <circle r="76" fill="none" stroke="#69E8CF" stroke-width="1" opacity="0.25"/>
      <text x="0" y="7" text-anchor="middle" class="bright serif" font-size="43" font-weight="700">3/2</text>
      <text x="0" y="31" text-anchor="middle" class="tealText" font-size="11" font-weight="750" letter-spacing="1.8">SCALE FACTOR</text>
    </g>

    <!-- Three panels follow the dependency chain, without implying an optical theorem. -->
    <rect x="78" y="302" width="400" height="416" rx="21" fill="url(#card)" stroke="#6B9AA5" stroke-opacity="0.37"/>
    <rect x="496" y="302" width="589" height="416" rx="21" fill="url(#card)" stroke="#6B9AA5" stroke-opacity="0.37"/>
    <rect x="1103" y="302" width="419" height="416" rx="21" fill="url(#card)" stroke="#6B9AA5" stroke-opacity="0.37"/>
    <path d="M478 510h17m-9-8 9 8-9 8M1085 510h17m-9-8 9 8-9 8" fill="none" stroke="#68DCCB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.73"/>

    <!-- Microscopic model -->
    <text x="108" y="347" class="tealText panelTitle">01  LOCAL MODEL</text>
    <text x="108" y="378" class="muted" font-size="17">Nearest-neighbor spins, periodic box</text>
    <rect x="132" y="408" width="264" height="176" fill="url(#bonds)" opacity="0.80"/>
    <rect x="143" y="394" width="264" height="176" fill="none" stroke="#77B8B6" stroke-width="1.4" opacity="0.26"/>
    <path d="M132 408l11-14m253 14 11-14m-275 190 11-14m253 14 11-14" stroke="#77B8B6" stroke-width="1.4" opacity="0.31"/>
    <use xlink:href="#up" transform="translate(132 408)"/><use xlink:href="#up" transform="translate(176 408)"/><use xlink:href="#down" transform="translate(220 408)"/><use xlink:href="#down" transform="translate(264 408)"/><use xlink:href="#up" transform="translate(308 408)"/><use xlink:href="#up" transform="translate(352 408)"/><use xlink:href="#down" transform="translate(396 408)"/>
    <use xlink:href="#up" transform="translate(132 452)"/><use xlink:href="#up" transform="translate(176 452)"/><use xlink:href="#up" transform="translate(220 452)"/><use xlink:href="#down" transform="translate(264 452)"/><use xlink:href="#up" transform="translate(308 452)"/><use xlink:href="#down" transform="translate(352 452)"/><use xlink:href="#down" transform="translate(396 452)"/>
    <use xlink:href="#down" transform="translate(132 496)"/><use xlink:href="#up" transform="translate(176 496)"/><use xlink:href="#up" transform="translate(220 496)"/><use xlink:href="#up" transform="translate(264 496)"/><use xlink:href="#up" transform="translate(308 496)"/><use xlink:href="#down" transform="translate(352 496)"/><use xlink:href="#up" transform="translate(396 496)"/>
    <use xlink:href="#down" transform="translate(132 540)"/><use xlink:href="#down" transform="translate(176 540)"/><use xlink:href="#up" transform="translate(220 540)"/><use xlink:href="#up" transform="translate(264 540)"/><use xlink:href="#up" transform="translate(308 540)"/><use xlink:href="#up" transform="translate(352 540)"/><use xlink:href="#down" transform="translate(396 540)"/>
    <text x="110" y="632" class="bright serif" font-size="27">π<tspan baseline-shift="sub" font-size="15">r</tspan>(s) ∝ r<tspan baseline-shift="super" font-size="16">D(s)</tspan></text>
    <text x="110" y="673" class="muted" font-size="16">The Gibbs family is the model assumption.</text>

    <!-- Two nested interval certificates. Intervals are placed to scale in r. -->
    <text x="526" y="347" class="tealText panelTitle">02  TWO BINDER CROSSINGS</text>
    <text x="526" y="378" class="muted" font-size="17">Population curves; both scale changes are 3/2</text>
    <text x="566" y="436" class="bright" font-size="19" font-weight="680">L = 4 → 6</text>
    <rect x="574" y="451" width="460" height="48" rx="24" fill="#1B5660" stroke="#66E3CE" stroke-width="1.8"/>
    <text x="804" y="481" text-anchor="middle" class="bright serif" font-size="20">∃ Binder crossing</text>
    <text x="574" y="525" text-anchor="middle" class="muted serif" font-size="18">12/19</text>
    <text x="1034" y="525" text-anchor="middle" class="muted serif" font-size="18">11/17</text>
    <text x="716" y="569" class="bright" font-size="19" font-weight="680">L = 8 → 12</text>
    <rect x="716" y="583" width="262" height="48" rx="24" fill="#246E73" stroke="#7DF0D7" stroke-width="1.8"/>
    <text x="847" y="613" text-anchor="middle" class="bright serif" font-size="20">∃ Binder crossing</text>
    <text x="716" y="654" text-anchor="middle" class="muted serif" font-size="18">7/11</text>
    <text x="978" y="654" text-anchor="middle" class="muted serif" font-size="18">20/31</text>
    <rect x="526" y="672" width="527" height="31" rx="15.5" fill="#123C49"/>
    <text x="789" y="693" text-anchor="middle" class="tealText serif" font-size="19">Nested windows · |r(4,6) − r(8,12)| &lt; 8/589</text>

    <!-- Quotient intervals. Horizontal placement uses a shared 1–3.2 scale. -->
    <text x="1132" y="347" class="amberText panelTitle">03  LOWEST-MODE GROWTH</text>
    <text x="1132" y="377" class="muted" font-size="16">Frozen near-crossing parameters;</text>
    <text x="1132" y="398" class="muted" font-size="16">each box uses its own k<tspan baseline-shift="sub" font-size="11">min</tspan> = 2π/L</text>
    <text x="1133" y="435" class="bright" font-size="19" font-weight="680">4 → 6</text>
    <text x="1218" y="435" class="muted serif" font-size="16">r = 16/25</text>
    <text x="1489" y="435" text-anchor="end" class="amberText serif" font-size="20">1.872–2.204×</text>
    <line x1="1144" y1="475" x2="1484" y2="475" stroke="#63828E" stroke-width="6" stroke-linecap="round" opacity="0.47"/>
    <line x1="1279" y1="475" x2="1330" y2="475" stroke="url(#amber)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1279" cy="475" r="7" fill="#FFE1AA"/><circle cx="1330" cy="475" r="7" fill="#FFE1AA"/>
    <text x="1133" y="551" class="bright" font-size="19" font-weight="680">8 → 12</text>
    <text x="1218" y="551" class="muted serif" font-size="16">r = 34/53</text>
    <text x="1489" y="551" text-anchor="end" class="amberText serif" font-size="20">1.559–3.015×</text>
    <line x1="1144" y1="591" x2="1484" y2="591" stroke="#63828E" stroke-width="6" stroke-linecap="round" opacity="0.47"/>
    <line x1="1230" y1="591" x2="1455" y2="591" stroke="url(#amber)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1230" cy="591" r="7" fill="#FFE1AA"/><circle cx="1455" cy="591" r="7" fill="#FFE1AA"/>
    <path d="M1144 617v12m154-12v12m154-12v12" stroke="#8DA7AF" stroke-width="1.5"/>
    <text x="1144" y="648" text-anchor="middle" class="muted" font-size="14">1×</text>
    <text x="1298" y="648" text-anchor="middle" class="muted" font-size="14">2×</text>
    <text x="1452" y="648" text-anchor="middle" class="muted" font-size="14">3×</text>
    <rect x="1132" y="669" width="355" height="34" rx="17" fill="#4C3B31"/>
    <text x="1309" y="691" text-anchor="middle" class="amberText" font-size="16" font-weight="700">Both lower bounds exceed 1</text>

    <!-- The probability statement belongs to coverage of premises, not to Lean deduction. -->
    <rect x="78" y="744" width="1444" height="113" rx="20" fill="#153143" stroke="#789AA4" stroke-opacity="0.36"/>
    <circle cx="118" cy="786" r="19" fill="#25675F" stroke="#6DEBCB" stroke-width="1.5"/>
    <path d="m109 786 6 6 12-14" fill="none" stroke="#D4FFF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="153" y="793" class="bright" font-size="23" font-weight="720">Lean-checked implication</text>
    <path d="M475 765v69" stroke="#70929C" stroke-width="1" opacity="0.52"/>
    <text x="504" y="779" class="tealText smallCaps" font-size="15">SIMULTANEOUS COVERAGE</text>
    <text x="505" y="810" class="bright serif" font-size="30">≥ 85%</text>
    <text x="629" y="808" class="muted" font-size="16">conditional on ideal iid exact draws + external concentration bound</text>
    <path d="M111 824H1486" stroke="#70929C" stroke-width="1" opacity="0.45"/>
    <text x="111" y="845" class="muted" font-size="15">Finite volume  •  quotients at frozen r and changing k<tspan baseline-shift="sub" font-size="10">min</tspan>  •  no T<tspan baseline-shift="sub" font-size="10">c</tspan>, exponent, or visible-light opalescence claim</text>
  </g>
</svg>
