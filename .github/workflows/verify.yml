name: Verify atomcrystal research artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: atomcrystal
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LEAN_NUM_THREADS: '2'
    steps:
      - name: Check out sources and certificates
        uses: actions/checkout@v4

      - name: Check provenance and reproduce rational certificates
        run: |
          python3 -B scripts/audit.py
          python3 -B scripts/scattering_provenance.py verify
          python3 -B scripts/scattering.py --check

      # Input definitions: https://github.com/leanprover/lean-action/blob/v1/action.yml
      - name: Install pinned Lean, fetch Mathlib cache and build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: atomcrystal
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'

      - name: Independently verify the final proof environment
        run: lake env leanchecker VerifiedPhysics.Final.MainTheorem

      - name: Report logical dependencies and compile isolated prediction
        run: |
          lake build VerifiedPhysics.Final.Audit
          lake env lean VerifiedPhysics/Prediction/FrozenScatteringPrediction.lean

      - name: Check that verification preserved the frozen artifact
        run: |
          python3 -B scripts/audit.py
          git -C .. diff --exit-code -- atomcrystal/lake-manifest.json atomcrystal/VerifiedPhysics atomcrystal/artifacts
